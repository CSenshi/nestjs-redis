name: NestJS Compatibility Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max_old_space_size=4096

jobs:
  compatibility-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']

      redis-cluster:
        image: grokzen/redis-cluster:7.0.10
        ports: ['7010-7015:7010-7015']
        env:
          IP: 0.0.0.0
          INITIAL_PORT: 7010

    strategy:
      fail-fast: false
      matrix:
        include:
          - nestjs-version: '9'
            reflect-metadata-version: '0.1'
          - nestjs-version: '10'
            reflect-metadata-version: '0.2'
          - nestjs-version: '11'
            reflect-metadata-version: '0.2'
          - nestjs-version: '12'
            reflect-metadata-version: '0.2'

    name: NestJS ${{ matrix.nestjs-version }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        name: Install pnpm
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Install NestJS ${{ matrix.nestjs-version }} for runtime tests
        run: |
          pnpm config set --location=project --json overrides '{"@nestjs/common":"${{ matrix.nestjs-version }}","@nestjs/core":"${{ matrix.nestjs-version }}","@nestjs/microservices":"${{ matrix.nestjs-version }}","@nestjs/platform-express":"${{ matrix.nestjs-version }}","@nestjs/platform-socket.io":"${{ matrix.nestjs-version }}","@nestjs/testing":"${{ matrix.nestjs-version }}","@nestjs/websockets":"${{ matrix.nestjs-version }}","reflect-metadata":"${{ matrix.reflect-metadata-version }}"}'
          pnpm install --node-linker=hoisted --no-frozen-lockfile

      - name: Verify resolved NestJS versions
        run: |
          pnpm list --json --depth Infinity \
            @nestjs/common \
            @nestjs/core \
            @nestjs/microservices \
            @nestjs/platform-express \
            @nestjs/platform-socket.io \
            @nestjs/testing \
            @nestjs/websockets |
          jq -e --arg major '${{ matrix.nestjs-version }}.' '
            def target:
              . == "@nestjs/common" or
              . == "@nestjs/core" or
              . == "@nestjs/microservices" or
              . == "@nestjs/platform-express" or
              . == "@nestjs/platform-socket.io" or
              . == "@nestjs/testing" or
              . == "@nestjs/websockets";
            [.. | objects | select(.from? | target)] as $packages |
            ($packages | map({ package: .from, version }) | unique) as $resolved |
            $resolved,
            (($packages | length) > 0 and all($packages[]; .version | startswith($major)))
          '

      - name: Test packages
        run: pnpm test

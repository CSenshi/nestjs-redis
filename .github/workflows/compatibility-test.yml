name: NestJS Compatibility Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max_old_space_size=4096

jobs:
  compatibility-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']

    strategy:
      fail-fast: false
      matrix:
        include:
          - nestjs-version: '9'
            reflect-metadata-version: '0.1'
          - nestjs-version: '10'
            reflect-metadata-version: '0.2'
          - nestjs-version: '11'
            reflect-metadata-version: '0.2'
          - nestjs-version: '12'
            reflect-metadata-version: '0.2'

    name: NestJS ${{ matrix.nestjs-version }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install specific NestJS version for testing
        run: |
          pnpm add -w \
            @nestjs/common@${{ matrix.nestjs-version }} \
            @nestjs/core@${{ matrix.nestjs-version }} \
            @nestjs/platform-express@${{ matrix.nestjs-version }} \
            reflect-metadata@${{ matrix.reflect-metadata-version }}

          pnpm add -D -w \
            @nestjs/microservices@${{ matrix.nestjs-version }} \
            @nestjs/platform-socket.io@${{ matrix.nestjs-version }} \
            @nestjs/testing@${{ matrix.nestjs-version }} \
            @nestjs/websockets@${{ matrix.nestjs-version }}

          pnpm --filter @nestjs-redis/client \
            --filter @nestjs-redis/health-indicator \
            --filter @nestjs-redis/lock \
            --filter @nestjs-redis/schedule \
            add -D @nestjs/testing@${{ matrix.nestjs-version }}

          pnpm --filter @nestjs-redis/socket.io-adapter add -D \
            @nestjs/platform-socket.io@${{ matrix.nestjs-version }} \
            @nestjs/testing@${{ matrix.nestjs-version }} \
            @nestjs/websockets@${{ matrix.nestjs-version }}

          pnpm --filter @nestjs-redis/streams-transporter add -D \
            @nestjs/microservices@${{ matrix.nestjs-version }}

      - name: Build packages
        run: pnpm build

      - name: Test packages
        run: pnpm test
